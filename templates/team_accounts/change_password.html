{% extends 'base.html' %}

{% block title %}Change Password - TeamSpace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-6">
    <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Change Password</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700">Update Password</button>
        </div>
    </form>
</div>
{% endblock %}
