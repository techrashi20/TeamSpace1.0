{% extends 'base.html' %}

{% block title %}Verify Code - TeamSpace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-6">
    <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Enter Verification Code</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Verification Code</label>
            <input type="text" name="code" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500" required placeholder="6-digit code">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">New Password</label>
            <input type="password" name="new_password" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700">Reset Password</button>
    </form>
</div>
{% endblock %}
