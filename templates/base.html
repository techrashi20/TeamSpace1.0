<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TeamSpace Portal{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #f8fafc;
            color: #334155;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 769px) {
            body {
                flex-direction: row;
            }
        }

        .mobile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        @media (min-width: 769px) {
            .mobile-header { display: none; }
        }

        .sidebar {
            width: 100%;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            z-index: 50;
        }

        @media (min-width: 769px) {
            .sidebar {
                width: 260px;
                position: fixed;
                height: 100vh;
                left: 0;
                top: 0;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .sidebar.active {
                display: flex;
            }
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #4f46e5;
            margin-bottom: 32px;
            padding-left: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
            flex-grow: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item a:hover {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .nav-item.active a {
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
        }

        .main-wrapper {
            flex-grow: 1;
            padding: 16px;
            width: 100%;
        }

        @media (min-width: 769px) {
            .main-wrapper {
                margin-left: 260px;
                padding: 32px;
                max-width: calc(100% - 260px);
            }
        }

        .user-profile-section {
            padding-top: 16px;
            margin-top: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    {% if user.is_authenticated %}
    <header class="mobile-header">
        <a href="{% url 'inbox' %}" class="brand-logo" style="margin-bottom:0;">TeamSpace</a>
        <button id="menu-toggle" style="background:none; border:1px solid #cbd5e1; padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer;">Menu</button>
    </header>

    <aside class="sidebar" id="app-sidebar">
        <a href="{% url 'inbox' %}" class="brand-logo">TeamSpace</a>
        <ul class="nav-menu">
            <li class="nav-item {% if active_tab == 'dashboard' %}active{% endif %}">
                <a href="{% url 'dashboard' %}"><span>Dashboard</span></a>
            </li>
            <li class="nav-item {% if active_tab == 'inbox' %}active{% endif %}">
                <a href="{% url 'inbox' %}"><span>Inbox</span></a>
            </li>
            <li class="nav-item {% if active_tab == 'chat' %}active{% endif %}">
                <a href="{% url 'chat_main' %}"><span>Team Chat</span></a>
            </li>
        </ul>
        <div class="user-profile-section">
            <span style="font-weight: 600; font-size: 14px;">{{ user.username }}</span>
            <a href="{% url 'logout' %}" style="color: #ef4444; font-size: 13px; text-decoration: none; font-weight: 600;">Logout</a>
        </div>
    </aside>
    {% endif %}

    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('app-sidebar');
        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
