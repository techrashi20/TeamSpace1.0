{% extends 'base.html' %}

{% block title %}{{ title }} - TeamSpace{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-sm">
    <h2 class="text-xl font-bold mb-4 text-gray-800">{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                {{ form.title }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                {{ form.description }}
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Assign To</label>
                    {{ form.assigned_to }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                    {{ form.priority }}
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    {{ form.status }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                    {{ form.due_date }}
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700 transition">Save Task</button>
        </div>
    </form>
</div>
{% endblock %}
