{% extends 'base.html' %}

{% block title %}Forgot Password - TeamSpace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-6">
    <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Forgot Password</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Enter your Username</label>
            <input type="text" name="username" class="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded hover:bg-indigo-700">Request Verification Code</button>
    </form>
</div>
{% endblock %}
