{% extends 'base.html' %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Archived Mails</h1>
    <div class="space-y-2">
        {% for msg in messages %}
            <div class="flex justify-between items-center border p-3 rounded bg-gray-50">
                <div>
                    <a href="{% url 'mail_detail' msg.id %}" class="font-semibold text-gray-800">{{ msg.subject }}</a>
                    <p class="text-xs text-gray-500">From: {{ msg.sender.username }}</p>
                </div>
                <a href="{% url 'toggle_archive' msg.id %}" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded hover:bg-indigo-200">Unarchive</a>
            </div>
        {% empty %}
            <p class="text-gray-500 text-sm">No archived mails.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
